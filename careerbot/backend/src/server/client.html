<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CareerBot テストクライアント</title>
<style>
  body { margin:0; font-family:system-ui, sans-serif; background:#0f1830; color:#eef2ff;
    display:flex; flex-direction:column; height:100vh; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; background:#16224a; }
  header img { width:40px; height:40px; }
  header h1 { font-size:18px; margin:0; }
  .state { margin-left:auto; font-size:13px; background:#1b2a4e; padding:6px 12px; border-radius:999px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:75%; padding:10px 14px; border-radius:14px; line-height:1.5; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#2f86d8; }
  .assistant { align-self:flex-start; background:#1b2a4e; }
  .sys { align-self:center; color:#9fb3d8; font-size:12px; }
  footer { display:flex; gap:8px; padding:12px 16px; background:#16224a; flex-wrap:wrap; }
  input, button, select { font-size:15px; border-radius:10px; border:none; padding:10px 14px; }
  #text { flex:1; min-width:180px; }
  button { background:#2f86d8; color:#fff; cursor:pointer; }
  button.secondary { background:#1b2a4e; }
  button#mic.rec { background:#e0556b; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
  <header>
    <img src="/logo" alt="logo"/>
    <h1>CareerBot</h1>
    <select id="mode" class="secondary" title="モード">
      <option value="general">通常相談</option>
      <option value="interview">面接練習</option>
      <option value="motivation">志望動機</option>
    </select>
    <span class="state" id="state">接続中…</span>
  </header>
  <div id="log"></div>
  <footer>
    <input id="text" placeholder="メッセージを入力（例: 自己PRが苦手です）" autocomplete="off"/>
    <button id="send">送信</button>
    <button id="mic" class="secondary" title="押している間だけ録音">🎤 押して話す</button>
  </footer>

<script>
const log = document.getElementById('log');
const stateEl = document.getElementById('state');
const textEl = document.getElementById('text');

function add(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
function setState(s) { stateEl.textContent = s; }

// ---- WebSocket ----
const ws = new WebSocket(`ws://${location.host}/ws`);
ws.binaryType = 'arraybuffer';
let outRate = 16000, outChunks = [], assistantEl = null;

ws.onopen = () => {
  ws.send(JSON.stringify({ type:'hello', device_id:'web-client', firmware_version:'web', device_token:'cb-dev-token' }));
};
ws.onclose = () => setState('切断');
ws.onerror = () => setState('エラー');

ws.onmessage = (ev) => {
  if (ev.data instanceof ArrayBuffer) { outChunks.push(new Uint8Array(ev.data)); return; }
  const m = JSON.parse(ev.data);
  switch (m.type) {
    case 'auth_ok': setState('待機中'); add('sys', 'セッション開始: ' + m.session_id); break;
    case 'state': setState({idle:'待機中',listening:'聞いています…',thinking:'考えています…',speaking:'話しています…',error:'エラー'}[m.value] || m.value); break;
    case 'transcript':
      if (m.role === 'user') add('user', m.text);
      break;
    case 'assistant_text':
      if (!assistantEl) assistantEl = add('assistant', '');
      assistantEl.textContent += m.text; log.scrollTop = log.scrollHeight; break;
    case 'audio_out_start': outRate = m.sample_rate || 16000; outChunks = []; break;
    case 'audio_out_end': playPcm(outChunks, outRate); outChunks = []; assistantEl = null; break;
    case 'error': add('sys', 'エラー: ' + m.code + ' ' + (m.message||'')); break;
    case 'ping': ws.send(JSON.stringify({ type:'pong' })); break;
  }
};

// ---- send text ----
function sendText() {
  const t = textEl.value.trim(); if (!t || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type:'text_in', text:t })); textEl.value=''; assistantEl=null;
}
document.getElementById('send').onclick = sendText;
textEl.addEventListener('keydown', e => { if (e.key==='Enter') sendText(); });
document.getElementById('mode').onchange = (e) =>
  ws.send(JSON.stringify({ type:'mode_set', value:e.target.value }));

// ---- playback (PCM16 -> Web Audio) ----
let playCtx;
function playPcm(chunks, rate) {
  if (!chunks.length) return;
  const total = chunks.reduce((n,c)=>n+c.length,0);
  const buf = new Uint8Array(total); let o=0;
  for (const c of chunks){ buf.set(c,o); o+=c.length; }
  const i16 = new Int16Array(buf.buffer, 0, Math.floor(total/2));
  playCtx = playCtx || new (window.AudioContext||window.webkitAudioContext)();
  const ab = playCtx.createBuffer(1, i16.length, rate);
  const f32 = ab.getChannelData(0);
  for (let i=0;i<i16.length;i++) f32[i]=i16[i]/32768;
  const src = playCtx.createBufferSource(); src.buffer=ab; src.connect(playCtx.destination); src.start();
}

// ---- mic capture (push-to-talk, 16k PCM16) ----
const micBtn = document.getElementById('mic');
let micCtx, micStream, micNode, recording=false;
async function startMic() {
  if (recording || ws.readyState!==1) return;
  micStream = await navigator.mediaDevices.getUserMedia({ audio:{ channelCount:1, echoCancellation:true } });
  micCtx = new (window.AudioContext||window.webkitAudioContext)({ sampleRate:16000 });
  const srcNode = micCtx.createMediaStreamSource(micStream);
  micNode = micCtx.createScriptProcessor(2048, 1, 1);
  ws.send(JSON.stringify({ type:'audio_in_start', sample_rate:16000, channels:1, format:'pcm16' }));
  recording = true; micBtn.classList.add('rec'); assistantEl=null;
  micNode.onaudioprocess = (e) => {
    if (!recording) return;
    const f = e.inputBuffer.getChannelData(0);
    const i16 = new Int16Array(f.length);
    for (let i=0;i<f.length;i++){ const s=Math.max(-1,Math.min(1,f[i])); i16[i]=s<0?s*32768:s*32767; }
    ws.send(i16.buffer);
  };
  srcNode.connect(micNode); micNode.connect(micCtx.destination);
}
function stopMic() {
  if (!recording) return;
  recording=false; micBtn.classList.remove('rec');
  try { micNode.disconnect(); micStream.getTracks().forEach(t=>t.stop()); micCtx.close(); } catch {}
  ws.send(JSON.stringify({ type:'audio_in_end' }));
}
micBtn.addEventListener('mousedown', startMic);
micBtn.addEventListener('mouseup', stopMic);
micBtn.addEventListener('mouseleave', stopMic);
micBtn.addEventListener('touchstart', (e)=>{e.preventDefault();startMic();});
micBtn.addEventListener('touchend', (e)=>{e.preventDefault();stopMic();});
</script>
</body>
</html>
