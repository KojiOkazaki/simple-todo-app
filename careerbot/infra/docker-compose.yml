# CareerBot local stack: relay backend + (optional) TLS-terminating nginx.
# Build context is the careerbot/ root so the Dockerfile can copy backend/.
services:
  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      PORT: "8080"
      VOICE_PROVIDER: "${VOICE_PROVIDER:-mock}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEVICE_TOKENS: "${DEVICE_TOKENS:-cb-dev-token}"
      STORAGE: "${STORAGE:-memory}"
    ports:
      - "8080:8080"
    restart: unless-stopped

  # TLS terminator / reverse proxy (enable for production; devices use wss://).
  nginx:
    image: nginx:alpine
    depends_on:
      - backend
    ports:
      - "443:443"
    volumes:
      - ./nginx/careerbot.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro   # mount TLS certs here
    profiles: ["tls"]
    restart: unless-stopped
