# Reverse proxy + WebSocket upgrade for CareerBot relay (spec 11.3 TLS).
# Devices connect to wss://<host>/ws. Provide certs and uncomment the TLS block.

upstream careerbot_backend {
    server backend:8080;
}

server {
    listen 443 ssl;
    server_name _;

    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # WebSocket endpoint.
    location /ws {
        proxy_pass http://careerbot_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # Health/other HTTP.
    location / {
        proxy_pass http://careerbot_backend;
        proxy_set_header Host $host;
    }
}
